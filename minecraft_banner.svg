<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maarij Bukhari - Full Stack, Mobile, Embedded Hardware Engineer">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="260"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky bands (flat, blocky) -->
    <rect x="0" y="0"   width="900" height="70"  fill="#6FA8E8"/>
    <rect x="0" y="70"  width="900" height="60"  fill="#7FB3ED"/>
    <rect x="0" y="130" width="900" height="60"  fill="#8FBEF2"/>

    <!-- sun (pixel block with rays) -->
    <g>
      <rect x="800" y="26" width="46" height="46" fill="#F4E37A"/>
      <rect x="806" y="20" width="34" height="6" fill="#F4E37A"/>
      <rect x="806" y="72" width="34" height="6" fill="#F4E37A"/>
      <rect x="794" y="32" width="6" height="34" fill="#F4E37A"/>
      <rect x="846" y="32" width="6" height="34" fill="#F4E37A"/>
      <animate attributeName="opacity" values="1;0.82;1" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- clouds (drift right, loop) -->
    <g fill="#F3F6FA" opacity="0.92">
      <g>
        <rect x="0" y="34" width="70" height="16"/>
        <rect x="16" y="26" width="40" height="10"/>
        <rect x="10" y="50" width="52" height="8"/>
        <animateTransform attributeName="transform" type="translate" from="-90 0" to="990 0" dur="34s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="0" y="96" width="90" height="16"/>
        <rect x="22" y="88" width="46" height="10"/>
        <animateTransform attributeName="transform" type="translate" from="-140 0" to="1040 0" dur="52s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- floating ore blocks (bob up/down) -->
    <!-- diamond ore -->
    <g>
      <rect x="120" y="40" width="30" height="30" fill="#7D7D7D"/>
      <rect x="126" y="46" width="7" height="7" fill="#4AEDD9"/>
      <rect x="138" y="56" width="7" height="7" fill="#4AEDD9"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <!-- gold ore -->
    <g>
      <rect x="176" y="60" width="26" height="26" fill="#7D7D7D"/>
      <rect x="181" y="65" width="6" height="6" fill="#E8B923"/>
      <rect x="191" y="74" width="6" height="6" fill="#E8B923"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="6.2s" begin="-1.5s" repeatCount="indefinite"/>
    </g>
    <!-- redstone ore -->
    <g>
      <rect x="230" y="44" width="24" height="24" fill="#7D7D7D"/>
      <rect x="235" y="49" width="6" height="6" fill="#A83232"/>
      <rect x="243" y="57" width="6" height="6" fill="#A83232"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4.4s" begin="-0.8s" repeatCount="indefinite"/>
    </g>

    <!-- title with hard pixel shadow (Minecraft-style offset) -->
    <text x="453" y="120" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-weight="700" font-size="52" letter-spacing="3" fill="#2E2E33">MAARIJ BUKHARI</text>
    <text x="450" y="117" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-weight="700" font-size="52" letter-spacing="3" fill="#F3ECD6">MAARIJ BUKHARI</text>

    <!-- subtitle -->
    <text x="451" y="156" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#26343f">FULL STACK   |   MOBILE   |   EMBEDDED HARDWARE</text>
    <text x="450" y="154" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#E8E3D3">FULL STACK   |   MOBILE   |   EMBEDDED HARDWARE</text>

    <!-- creeper standing on the grass -->
    <g transform="translate(792,142)">
      <rect x="0" y="0" width="48" height="48" fill="#5D9C3B"/>
      <rect x="0" y="0" width="48" height="6" fill="#6FB047"/>
      <rect x="0" y="42" width="48" height="6" fill="#4C8130"/>
      <rect x="8"  y="14" width="10" height="10" fill="#20241C"/>
      <rect x="30" y="14" width="10" height="10" fill="#20241C"/>
      <rect x="20" y="24" width="8" height="9"  fill="#20241C"/>
      <rect x="14" y="33" width="8" height="8"  fill="#20241C"/>
      <rect x="26" y="33" width="8" height="8"  fill="#20241C"/>
    </g>

    <!-- ground: grass fringe + grass band + dirt with speckle -->
    <!-- grass fringe (blocky blades poking up) -->
    <g fill="#5D9C3B">
      <rect x="0"   y="184" width="30" height="6"/>
      <rect x="60"  y="182" width="24" height="8"/>
      <rect x="150" y="185" width="30" height="5"/>
      <rect x="300" y="183" width="26" height="7"/>
      <rect x="470" y="185" width="30" height="5"/>
      <rect x="640" y="182" width="24" height="8"/>
      <rect x="770" y="184" width="30" height="6"/>
    </g>
    <rect x="0" y="190" width="900" height="16" fill="#5D9C3B"/>
    <rect x="0" y="190" width="900" height="4"  fill="#6FB047"/>
    <rect x="0" y="206" width="900" height="54" fill="#79553A"/>

    <!-- dirt speckle -->
    <g fill="#66472F" opacity="0.9">
      <rect x="40"  y="214" width="10" height="10"/>
      <rect x="140" y="230" width="8"  height="8"/>
      <rect x="250" y="212" width="9"  height="9"/>
      <rect x="360" y="234" width="10" height="10"/>
      <rect x="470" y="216" width="8"  height="8"/>
      <rect x="590" y="232" width="9"  height="9"/>
      <rect x="700" y="214" width="10" height="10"/>
      <rect x="820" y="230" width="8"  height="8"/>
    </g>
    <g fill="#8B6547" opacity="0.8">
      <rect x="90"  y="224" width="8" height="8"/>
      <rect x="210" y="240" width="9" height="9"/>
      <rect x="410" y="220" width="8" height="8"/>
      <rect x="540" y="242" width="9" height="9"/>
      <rect x="760" y="222" width="8" height="8"/>
    </g>
  </g>
</svg>
